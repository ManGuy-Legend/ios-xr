name: Build XNU (T8020)

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "macOS version whose xnu to build (15.0 = xnu-11215, iOS 26 era)"
        default: "15.0"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: T8020
      keep_going:
        description: "make -k (collect all errors in one run)"
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  MACOS_VERSION: ${{ inputs.macos_version || '15.0' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'T8020' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build
        run: |
          git clone --depth 1 "$DXB_REPO" dxb
          # Copy our patches into dxb's version-specific patches dir
          # (darwin-xnu-build 15.0+ reads from patches/$VERSION/, not top-level)
          PATCH_DIR="dxb/patches/${MACOS_VERSION}"
          mkdir -p "$PATCH_DIR"
          cp xnu/patches/*.patch "$PATCH_DIR/"
          ls -la "$PATCH_DIR/"

      - name: Configure for T8020 (arm64e / A12)
        run: |
          # T8020 is arm64e (first Apple PAC chip). Remove x86_64 from
          # ARCHS but keep arm64e (unlike ios-sweet which drops to arm64
          # for Snapdragon's non-PAC cores).
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64e" VALID_ARCHS="arm64e"/' dxb/build.sh || true
          # Wrap compiler with ccache
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh || true

      - name: Install deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh checks for xcodes binary
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          xcodebuild -version
          # ccache wrappers
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build XNU
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Collect kernel binary
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out/
          (cd out && shasum -a 256 kernel.* > SHA256SUMS 2>/dev/null) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-t8020
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Package build tree (for debugging compile errors)
        if: always()
        run: |
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' \
            --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj xnu 2>/dev/null || true
          ls -la buildtree.tgz 2>/dev/null || echo "no buildtree"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          if-no-files-found: ignore
          retention-days: 7
